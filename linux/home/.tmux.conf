# Shell

set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish


# Status bar

set -g status on
set -g status-position bottom
set -g status-style "fg=white,bg=default"
set -g status-left ""
set -g status-left-length 0
set -g status-right ' #([ "#{pane_current_path}" = "$HOME" ] && echo "~" || basename "#{pane_current_path}") '
set -g status-right-style "fg=white,bg=default"
setw -g window-status-style "fg=white,bg=default"
setw -g window-status-current-style "fg=white,bg=default,bold"


# Borders

set -g pane-border-status off
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=white"


# Messages

set -g message-style "fg=white,bg=#2c2c2c,align=centre"
set -g message-command-style "fg=white,bg=#2c2c2c,align=centre"


# Windows

setw -g window-style "fg=default,bg=default"
setw -g window-active-style "fg=default,bg=default"


# Modes

setw -g clock-mode-colour white
setw -g mode-style "fg=black,bg=white,bold"
