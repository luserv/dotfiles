TARGET_OS_NAME="CachyOS"
ENABLE_UKI=yes
CUSTOM_UKI_NAME="cachyos"
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes
KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0"
KERNEL_CMDLINE[default]+=" initramfs_async=0 systemd.tty.term.console=dumb"
BOOT_ORDER="linux-cachyos, linux-cachyos-*, *, *fallback, Snapshots"
MAX_SNAPSHOT_ENTRIES=6
SNAPSHOT_FORMAT_CHOICE=5
