; Polybar - rounded pill layout, Omarchy palette

[colors]
background = #E60B0C16
background-alt = #1c2033
foreground = #ddf7ff
primary = #82FB9C
secondary = #7cf8f7
accent = #c3a6ff
warn = #f7c873
alert = #ff6b81
disabled = #6a6e95
transparent = #00000000

[bar/mainbar]
monitor =
width = 100%
height = 30
offset-x = 0
offset-y = 0
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 1
font-0 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-1 = Font Awesome 7 Free Solid:size=10;3
font-2 = Font Awesome 7 Brands:size=10;3
font-3 = JetBrainsMono Nerd Font:size=18;5

modules-left = xworkspaces
modules-center = date
modules-right = pulseaudio battery tray lock

fixed-center = true
enable-ipc = true
override-redirect = false
cursor-click = pointer

[module/xworkspaces]
type = internal/xworkspaces
; Event-driven (EWMH): updates instantly, shows only active and occupied workspaces
pin-workspaces = false
enable-click = true
enable-scroll = false
label-active = %{F#82FB9C}%{T4}%{T-}%{F-}%{B#82FB9C}%{F#0B0C16} %index% %{F-}%{B-}%{F#82FB9C}%{T4}%{T-}%{F-}
label-occupied = %index%
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 2
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2
label-empty =

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %A %d %B %Y
time-alt = %H:%M:%S
format = <label>
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.background-alt}
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.background-alt}
label = %{F#c3a6ff}󰃭%{F-} %date%  %{F#82FB9C}󰥔%{F-} %time%
label-background = ${colors.background-alt}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume><label-volume>
format-volume-prefix = 
format-volume-prefix-font = 4
format-volume-prefix-foreground = ${colors.background-alt}
format-volume-suffix = 
format-volume-suffix-font = 4
format-volume-suffix-foreground = ${colors.background-alt}
label-volume = " %percentage%%"
label-volume-background = ${colors.background-alt}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.secondary}
ramp-volume-background = ${colors.background-alt}
ramp-volume-padding-left = 1
format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 4
format-muted-prefix-foreground = ${colors.background-alt}
format-muted-suffix = 
format-muted-suffix-font = 4
format-muted-suffix-foreground = ${colors.background-alt}
label-muted = " 󰝟 muted"
label-muted-foreground = ${colors.disabled}
label-muted-background = ${colors.background-alt}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 98
low-at = 15
poll-interval = 5
format-charging = <animation-charging><label-charging>
format-discharging = <ramp-capacity><label-discharging>
format-full = <label-full>
format-low = <animation-low><label-low>
format-charging-prefix = 
format-discharging-prefix = 
format-full-prefix = 
format-low-prefix = 
format-charging-suffix = 
format-discharging-suffix = 
format-full-suffix = 
format-low-suffix = 
format-charging-prefix-font = 4
format-discharging-prefix-font = 4
format-full-prefix-font = 4
format-low-prefix-font = 4
format-charging-suffix-font = 4
format-discharging-suffix-font = 4
format-full-suffix-font = 4
format-low-suffix-font = 4
format-charging-prefix-foreground = ${colors.background-alt}
format-discharging-prefix-foreground = ${colors.background-alt}
format-full-prefix-foreground = ${colors.background-alt}
format-low-prefix-foreground = ${colors.background-alt}
format-charging-suffix-foreground = ${colors.background-alt}
format-discharging-suffix-foreground = ${colors.background-alt}
format-full-suffix-foreground = ${colors.background-alt}
format-low-suffix-foreground = ${colors.background-alt}
label-charging = " %percentage%%"
label-charging-background = ${colors.background-alt}
label-discharging = " %percentage%%"
label-discharging-background = ${colors.background-alt}
label-full = " 󰁹 Full "
label-full-background = ${colors.background-alt}
label-full-foreground = ${colors.primary}
label-low = " %percentage%%"
label-low-background = ${colors.background-alt}
label-low-foreground = ${colors.alert}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.warn}
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4-foreground = ${colors.primary}
ramp-capacity-background = ${colors.background-alt}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰂉
animation-charging-3 = 󰂋
animation-charging-foreground = ${colors.primary}
animation-charging-background = ${colors.background-alt}
animation-charging-framerate = 750
animation-low-0 = 󰂃
animation-low-1 = 󰂎
animation-low-foreground = ${colors.alert}
animation-low-background = ${colors.background-alt}
animation-low-framerate = 500

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 60%
tray-background = ${colors.background}

[module/lock]
type = custom/text
format = 
format-foreground = ${colors.alert}
format-padding = 1
click-left = xflock4

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
