conky.config = {
  alignment = 'top_right',
  gap_x = 28,
  gap_y = 48,
  minimum_width = 360,
  maximum_width = 360,
  update_interval = 2,
  double_buffer = true,
  own_window = true,
  own_window_type = 'desktop',
  own_window_color = '#960b0f14',
  border_inner_margin = 16,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  use_xft = true,
  font = 'DejaVu Sans Mono:size=14',
  default_color = 'dddddd',
  color1 = '88c0d0',
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
}

conky.text = [[
${color1}${time %H:%M}${color}  ${time %A %d %b}
${hr 1}
${execpi 1 ~/.config/conky/workspaces.sh}
${hr 1}
${color1}CPU${color}  ${cpu}%  ${freq_g 1} GHz  ${alignr}${hwmon coretemp temp 1}°C
${cpubar 9}
${color1}RAM${color}  ${mem} / ${memmax}  ${alignr}${memperc}%
${membar 9}
${color1}Swap${color}  ${swap} / ${swapmax}  ${alignr}${swapperc}%
${color1}Disk /${color}  ${fs_used /} / ${fs_size /}  ${alignr}${fs_used_perc /}%
${fs_bar 9 /}
${color1}Up${color}  ${uptime_short}
${hr 1}
${color1}Net wlan0${color}  ${alignr}${addr wlan0}
 down ${downspeed wlan0}  ${alignr}up ${upspeed wlan0}
${hr 1}
${color1}Top CPU${color}
 ${top name 1} ${alignr}${top cpu 1}%
 ${top name 2} ${alignr}${top cpu 2}%
 ${top name 3} ${alignr}${top cpu 3}%
${color1}Top RAM${color}
 ${top_mem name 1} ${alignr}${top_mem mem_res 1}  ${top_mem mem 1}%
 ${top_mem name 2} ${alignr}${top_mem mem_res 2}  ${top_mem mem 2}%
 ${top_mem name 3} ${alignr}${top_mem mem_res 3}  ${top_mem mem 3}%
]]
