conky.config = {
  alignment = 'top_right',
  gap_x = 24,
  gap_y = 48,
  minimum_width = 260,
  maximum_width = 260,
  update_interval = 2,
  double_buffer = true,
  own_window = true,
  own_window_type = 'desktop',
  own_window_color = '#960b0f14',
  border_inner_margin = 12,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  use_xft = true,
  font = 'DejaVu Sans Mono:size=10',
  default_color = 'dddddd',
  color1 = '88c0d0',
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
}

conky.text = [[
${color1}${time %H:%M}${color}  ${time %A %d %b}
${hr 1}
${execpi 1 ~/.config/conky/workspaces.sh}
${hr 1}
${color1}CPU${color}  ${cpu}%  ${alignr}${cpubar 6,120}
${color1}Temp${color}  ${hwmon coretemp temp 1}°C  ${alignr}${color1}Up${color} ${uptime_short}
${color1}RAM${color}  ${memperc}%  ${alignr}${membar 6,120}
${color1}Disk /${color}  ${fs_used_perc /}%  ${alignr}${fs_bar 6,120 /}
${hr 1}
${color1}Net wlan0${color}  ${alignr}${addr wlan0}
 down ${downspeed wlan0}  ${alignr}up ${upspeed wlan0}
${hr 1}
${color1}Top CPU${color}
 ${top name 1} ${alignr}${top cpu 1}%
 ${top name 2} ${alignr}${top cpu 2}%
 ${top name 3} ${alignr}${top cpu 3}%
${color1}Top RAM${color}
 ${top_mem name 1} ${alignr}${top_mem mem 1}%
 ${top_mem name 2} ${alignr}${top_mem mem 2}%
 ${top_mem name 3} ${alignr}${top_mem mem 3}%
]]
