include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family Hack Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.25

# Window
window_padding_width 20
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as ESC + CR (same as the Alacritty binding).
map shift+enter send_text all \x1b\r
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Colors: Nordfox (copied from Alacritty)
foreground #cdcecf
background #2e3440
selection_foreground #cdcecf
selection_background #3e4a5b
cursor #abb1bb
cursor_text_color #cdcecf

color0 #3b4252
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0
color8 #465780
color9 #d06f79
color10 #b1d196
color11 #f0d399
color12 #8cafd2
color13 #c895bf
color14 #93ccdc
color15 #e7ecf4
color16 #c9826b
color17 #bf88bc
