# Big Sur blur for polybar
backend = "glx";
vsync = false;
blur-background = false;
blur-method = "dual_kawase";
blur-strength = 8;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
blur-background-frame = true;
blur-background-fixed = true;
fading = false;
fade-delta = 10;
shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.25;
opacity-rule = [
  "90:class_g = 'polybar'"
];
wintypes: {
  dock = { shadow = true; blur-background = true; };
  dnd = { shadow = false; };
};

# Animaciones estilo serpantinum (picom >= 12)
animations = (
  { triggers = ["open", "show"]; preset = "appear"; duration = 0.18; scale = 0.92; },
  { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.14; scale = 0.92; },
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.18; }
);
