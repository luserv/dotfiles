# Big Sur blur for polybar
backend = "glx";
vsync = true;
blur-background = true;
blur-method = "kawase";
blur-strength = 8;
blur-background-frame = true;
blur-background-fixed = true;
fading = true;
fade-delta = 5;
shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.25;
opacity-rule = [
  "90:class_g = 'polybar'"
];
wintypes: {
  dock = { shadow = true; blur-background = true; };
  dnd = { shadow = false; };
};
